[mypy]
python_version = 3.12
ignore_missing_imports = False
strict = True

# Third-party modules that ship no type information (no py.typed / no stubs).
# `ignore_missing_imports` is a safe fallback: when real stubs are installed
# (e.g. `types-tqdm` from requirements-dev.txt) mypy still uses them.
[mypy-rdl_ml_utils.*]
ignore_missing_imports = True

[mypy-hvac.*]
ignore_missing_imports = True

[mypy-llm_router_plugins.*]
ignore_missing_imports = True

[mypy-tqdm.*]
ignore_missing_imports = True
