name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.14"

jobs:
  tests:
    name: Tests (${{ matrix.suite.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite:
          - name: api
            path: llm_router_api/tests
          - name: lib
            path: llm_router_lib/tests
          - name: cli
            path: llm_router_cli/tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            setup.py
            requirements.txt
            requirements-auth.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[api]" -r requirements-auth.txt -r requirements-dev.txt

      - name: Run tests
        run: pytest ${{ matrix.suite.path }} -q -p no:cacheprovider

  docker:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: tests
    runs-on:
      - self-hosted
      - builder

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get image version
        id: vars
        run: |
          echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Login to Quay
        run: |
          echo "${{ secrets.QUAY_PASSWORD }}" | docker login quay.io \
            -u "${{ secrets.QUAY_USERNAME }}" \
            --password-stdin

      - name: Build image
        run: |
          docker build -f docker/Dockerfile --no-cache --progress plain \
            -t quay.io/radlab/llm-router:${{ steps.vars.outputs.VERSION }} \
            -t quay.io/radlab/llm-router:latest .

      - name: Push image
        if: success()
        run: |
          docker push quay.io/radlab/llm-router:${{ steps.vars.outputs.VERSION }}
          docker push quay.io/radlab/llm-router:latest

      - name: Cleanup image
        run: docker images 'quay.io/radlab/llm-router' --format '{{.ID}}' | xargs docker rmi -f || true

      - name: Logout
        if: always()
        run: docker logout quay.io
