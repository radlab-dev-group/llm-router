name: Reusable Test Suite

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14"

jobs:
  tests:
    name: Tests (${{ matrix.suite.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite:
          - name: api
            path: llm_router_api/tests
          - name: lib
            path: llm_router_lib/tests
          - name: cli
            path: llm_router_cli/tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            setup.py
            requirements.txt
            requirements-auth.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[api]" -r requirements-auth.txt -r requirements-dev.txt

      - name: Run tests
        run: pytest ${{ matrix.suite.path }} -q -p no:cacheprovider
