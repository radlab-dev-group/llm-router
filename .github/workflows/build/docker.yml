name: Build and Push Docker Image

on:
  workflow_call:
    inputs:
      run-tests:
        description: Run the test suite before building
        type: boolean
        default: true
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    if: inputs.run-tests
    uses: ./.github/workflows/build/tests.yml

  docker:
    needs: tests
    if: always() && (inputs.run-tests == false || needs.tests.result == 'success')
    # Serialise pushes across tags so `latest` can't end up pointing at an older commit
    concurrency:
      group: docker-push
      cancel-in-progress: false
    runs-on:
      - self-hosted
      - builder

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get image version
        id: vars
        run: |
          echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Login to Quay
        run: |
          echo "${{ secrets.QUAY_PASSWORD }}" | docker login quay.io \
            -u "${{ secrets.QUAY_USERNAME }}" \
            --password-stdin

      - name: Build image
        run: |
          docker build -f docker/Dockerfile \
            -t quay.io/radlab/llm-router:${{ steps.vars.outputs.VERSION }} \
            -t quay.io/radlab/llm-router:latest .

      - name: Push image
        run: |
          docker push quay.io/radlab/llm-router:${{ steps.vars.outputs.VERSION }}
          docker push quay.io/radlab/llm-router:latest

      # Untag only this run's image — keeps the local layer cache for the next build
      - name: Cleanup image
        if: always()
        run: |
          docker rmi quay.io/radlab/llm-router:${{ steps.vars.outputs.VERSION }} || true

      - name: Logout
        if: always()
        run: docker logout quay.io
