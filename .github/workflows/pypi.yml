name: Build and Publish PyPI Package

on:
  workflow_call:
    inputs:
      run-tests:
        description: Run the test suite before publishing
        type: boolean
        default: true
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    if: inputs.run-tests
    uses: ./.github/workflows/tests.yml

  pypi:
    needs: tests
    if: always() && (inputs.run-tests == false || needs.tests.result == 'success')
    # Serialise publishes across tags so versions can't be uploaded out of order
    concurrency:
      group: pypi-publish
      cancel-in-progress: false
    runs-on:
      - self-hosted
      - builder

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get package version
        id: vars
        run: |
          echo "VERSION=$(cat .version)" >> $GITHUB_OUTPUT

      - name: Verify PyPI credentials
        env:
          PYPI_KEY: ${{ secrets.PYPI_KEY }}
        run: |
          if [ -z "$PYPI_KEY" ]; then
            echo "::error::PYPI_KEY is empty. Define it in repo/org secrets and keep 'secrets: inherit' on the caller."
            exit 1
          fi

      # A venv keeps build/twine out of the runner's ~/.local, where they would
      # clash with the distro-packaged requests/urllib3 pair.
      - name: Create build environment
        run: |
          python3 -m venv .venv-publish
          .venv-publish/bin/python -m pip install --upgrade pip build twine

      - name: Build package
        run: .venv-publish/bin/python -m build --outdir dist .

      - name: Publish package
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_KEY }}
        run: |
          .venv-publish/bin/python -m twine check dist/*
          .venv-publish/bin/python -m twine upload dist/* --non-interactive
