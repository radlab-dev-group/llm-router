[build-system]
requires = [
    "setuptools>=68.0.0",
    "wheel>=0.42.0",
]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 85
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | build
  | dist
)/
'''

[tool.bandit]
skips = ["B101", "B110", "B112"]