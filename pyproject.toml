[build-system]
requires = [
    "setuptools>=68.0.0",
    "wheel>=0.42.0",
]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 85
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | build
  | dist
)/
'''

[tool.bandit]
skips = ["B101", "B110", "B112"]

[tool.coverage.run]
# All three shipped packages: each carries its own test suite, and measuring
# only the API left the SDK and the CLI unmeasured.
source = ["llm_router_api", "llm_router_lib", "llm_router_cli"]
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
